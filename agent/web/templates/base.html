<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HCC Perf Agent{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a class="brand" href="/">HCC Perf Agent</a>
  <nav>
    <a href="/">CPT runs</a>
    <a href="/reviews">Reviews</a>
    <a href="/alerts">Perf cluster alerts</a>
  </nav>
  <span class="user">{{ user or "not signed in" }}</span>
</header>
<main>
  <p class="banner">Report-only preview. Labels are rules applied to today's <code>pass_or_fail</code> decisions; nothing is changed in Jenkins or status data. Reviews are stored in <code>insights_perf_triage_reviews</code>.</p>
  {% block content %}{% endblock %}
</main>
</body>
</html>
