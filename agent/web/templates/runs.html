{% extends "base.html" %}
{% from "_macros.html" import metric_chip, tag %}
{% block content %}
<h1>CPT runs</h1>
<form class="filters" id="run-filters" method="get">
  <label>Last <input type="number" name="days" value="{{ days }}" min="1" max="60"> days</label>
  <label>Job
    <select name="job">
      <option value="">all</option>
      {% for j in jobs %}<option {% if j == job %}selected{% endif %}>{{ j }}</option>{% endfor %}
    </select>
  </label>
  <label>Result
    <select name="result">
      {% for v, text, hint in [
          ("FAIL", "FAIL", "Still failing"),
          ("FAIL-PASS", "FAIL → PASS", "pass_or_fail said FAIL; a review changed it to PASS"),
          ("ERROR", "ERROR", "A check could not run"),
          ("PASS", "PASS", "Passing now, including runs a review changed to PASS"),
          ("", "all", "")] %}<option value="{{ v }}" title="{{ hint }}" {% if v == result %}selected{% endif %}>{{ text }}</option>{% endfor %}
    </select>
  </label>
  <label>Agent label
    <select name="label">
      <option value="">all</option>
      {% for l in labels %}<option {% if l == label %}selected{% endif %}>{{ l }}</option>{% endfor %}
    </select>
  </label>
  <label>Review
    <select name="review">
      {% for v, label in [("", "all"), ("pending", "pending"), ("reviewed", "reviewed")] %}<option value="{{ v }}" {% if v == review %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  </label>
  <label><input type="checkbox" name="show_pr" value="true" {% if show_pr %}checked{% endif %}> include PR runs</label>
  <button class="apply">Apply</button>
  <span class="loading-note muted small" hidden>updating…</span>
</form>

<div id="runs-results" aria-live="polite">
{% include "_runs_results.html" %}
</div>
<script src="/static/runs.js" defer></script>
{% endblock %}
