# Internal shard, like the Jenkins route in this namespace: reachable on the Red Hat network only.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: hcc-perf-agent
  labels:
    shard: internal
  annotations:
    # Chat turns can exceed the 30 s router default.
    haproxy.router.openshift.io/timeout: 180s
spec:
  host: hcc-perf-agent.apps.int.prod-scale-spoke1-dc-rdu3.itup.redhat.com
  to:
    kind: Service
    name: hcc-perf-agent
  port:
    targetPort: web
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
