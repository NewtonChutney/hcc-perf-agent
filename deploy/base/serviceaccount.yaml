# oauth-proxy authenticates users against the cluster's OAuth server as this
# ServiceAccount; the redirect reference lets the OAuth server send users back to the Route.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hcc-perf-agent
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"hcc-perf-agent"}}
